name: UI tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # The lockfile has entries resolved from an internal feed that GitHub runners cannot reach.
      - name: Point lockfile at the public npm registry
        run: sed -i 's#https://packagefeedproxy.microsoft.io/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
